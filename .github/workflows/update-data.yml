# Weekly Data Update Workflow
# This workflow runs every Tuesday at 1pm CT and can also be triggered manually.
# It runs the EQB scraper and updates the site data if changes are found.
# EQB publishes new editions on Tuesdays around noon CT.

name: Weekly Data Update

on:
  schedule:
    # Run every Tuesday at 1pm Central Time (7pm UTC)
    # Runs 30 min after EQB's ~noon Tuesday publication
    - cron: '0 19 * * 2'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run EQB Monitor scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/update_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data.js; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.js
          git commit -m "Auto-update: Weekly data refresh $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No new data found in this week's EQB Monitor."
